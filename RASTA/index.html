<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live Match Statistics</title>
  <style>
    body { margin:0; font-family: Arial, sans-serif; background:#e0e0e0; }
    .header { background: #fff; color: #000; text-align: center; padding: 20px 0; }
    .header h1 { margin: 0; font-size: 36px; }
    .header .sub { font-size: 16px; color: #333; margin-top: 5px; }
    .scoreboard {
      background: url('https://img.freepik.com/free-photo/doing-sport-concept_23-2151937746.jpg') no-repeat center center;
      background-size: cover;
      margin: 20px auto;
      padding: 20px;
      width: 90%; max-width: 800px;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
      position: relative;
    }
    .vs-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: nowrap;
      position: relative;
    }
    .team {
      display: flex;
      align-items: center;
      flex: 1;
      min-width: 120px;
    }
    .team img {
      width: 80px;
      height: 110px;
      margin-right: 10px;
      border-radius: 50% / 50%;
      object-fit: cover;
      background: #fff;
    }
    .vs {
      font-size: 48px;
      font-weight: bold;
      flex: 0;
      margin: 0 10px;
    }
    .timer-center {
      position: absolute;
      top: -30px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 24px;
      background: #000;
      color: #fff;
      padding: 6px 12px;
      border-radius: 5px;
    }
    .scorers { text-align: center; font-size: 14px; margin: 15px 0; color: #000; }
    .stats { margin-top: 20px; }
    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #283593;
      margin: 5px 0;
      padding: 10px;
      border-radius: 20px;
      color: white;
    }
    .stat-row .value1,
    .stat-row .label,
    .stat-row .value2 {
      text-align: center;
      flex: 1;
    }
    .stat-row .value1 { color: #2196F3; font-weight: bold; }
    .stat-row .value2 { color: #F44336; font-weight: bold; }
    @media (max-width: 600px) {
      .header h1 { font-size: 28px; }
      .vs { font-size: 32px; }
      .team img { width: 60px; height: 90px; }
      .timer-center { font-size: 18px; padding: 4px 8px; }
      .stat-row { flex-direction: row; }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1 id="title">MATCH STATISTICS</h1>
    <div class="sub" id="group"></div>
  </div>
  <div class="scoreboard">
    <div class="vs-container">
      <div class="team">
        <img id="flag1" src="" alt="Team 1 Flag">
        <span id="team1">TEAM 1</span>
      </div>
      <div class="vs">
        <span id="score1">0</span> : <span id="score2">0</span>
      </div>
      <div class="team" style="justify-content: flex-end;">
        <span id="team2">TEAM 2</span>
        <img id="flag2" src="" alt="Team 2 Flag">
      </div>
      <div class="timer-center" id="timer">00:00</div>
    </div>
    <div class="scorers">
      <div id="scorers1"></div>
      <div id="scorers2"></div>
    </div>
    <div class="stats" id="stats"></div>
  </div>
  <script>
    (function(){
      let cfg = {};
      try { cfg = JSON.parse(localStorage.getItem('matchConfig') || '{}'); } catch(e) {}
      const get = id => document.getElementById(id);
      function setLogo(id, url) {
        if (!url) return;
        let full = url;
        if (!/^https?:\/\//i.test(url)) full = 'https://' + url;
        get(id).src = full;
      }
      get('title').textContent = cfg.title || 'MATCH STATISTICS';
      get('group').textContent = cfg.group || '';
      get('team1').textContent = cfg.team1Name || 'TEAM 1';
      get('team2').textContent = cfg.team2Name || 'TEAM 2';
      setLogo('flag1', cfg.team1Flag);
      setLogo('flag2', cfg.team2Flag);
      get('score1').textContent = cfg.team1Score || 0;
      get('score2').textContent = cfg.team2Score || 0;
      ['scorers1','scorers2'].forEach((id,i)=>{
        const arr = JSON.parse(localStorage.getItem(id) || '[]');
        const el = get(id);
        if (arr.length) el.textContent = `${cfg[i?'team2Name':'team1Name']||'Team'} Scorers: ` + arr.map(s=>`${s.name}${s.min?` (${s.min}')`:''}`).join(', ');
      });
      let phase = +localStorage.getItem('halfPhase') || 0;
      let startTs = +localStorage.getItem('startTs') || 0;
      const timerEl = get('timer');
      function update(){
        const elapsed = Math.min((Date.now() - startTs)/1000, phase===1?2700:phase===3?5400:0);
        const m = String(Math.floor(elapsed/60)).padStart(2,'0');
        const s = String(Math.floor(elapsed%60)).padStart(2,'0');
        timerEl.textContent = `${m}:${s}`;
        if ((phase===1 && elapsed<2700) || (phase===3 && elapsed<5400)) requestAnimationFrame(update);
      }
      if (phase===1||phase===3) update();
      else if (phase===2) timerEl.textContent = '45:00';
      else if (phase===4) timerEl.textContent = '90:00';
      // Stats
      const stats = [ ['totalAttempts','Total Attempts'], ['onTarget','Attempts on Target'], ['fouls','Fouls Committed'], ['yellowCards','Yellow Cards'], ['redCards','Red Cards'], ['offsides','Offsides'], ['corners','Corners'], ['possession','Possession'] ];
      const sd = get('stats'); sd.innerHTML = '';
      stats.forEach(([k,l])=>{
        const row = document.createElement('div'); row.className='stat-row';
        const v1 = document.createElement('div'); v1.className='value1';
        const label = document.createElement('div'); label.className='label';
        const v2 = document.createElement('div'); v2.className='value2';
        let a = cfg[`${k}1`] != null ? cfg[`${k}1`] : 0;
        let b = cfg[`${k}2`] != null ? cfg[`${k}2`] : 0;
        if (k==='possession') { a += '%'; b += '%'; }
        v1.textContent = a; label.textContent = l; v2.textContent = b;
        row.append(v1,label,v2); sd.appendChild(row);
      });
    })();
  </script>
</body>
</html>
