<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Blind XSS Lab - Admin</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; }
        .comment { margin-bottom: 20px; background: #f9f9f9; padding: 10px; border-radius: 4px; }
        .meta { color: #666; font-size: 13px; }
    </style>
</head>
<body>
    <h1>Admin Panel: View User Comments</h1>
    <div id="comments"></div>
    <button onclick="localStorage.removeItem('comments'); location.reload();">Delete All Comments</button>
    <hr>
    <p>
      <b>Instructions:</b> If a user submitted a blind XSS payload, it will execute here as the "admin" is viewing it.
    </p>

    <script>
    // Load comments from localStorage
    function showComments() {
        let comments = JSON.parse(localStorage.getItem('comments') || "[]");
        let html = '';
        for (const c of comments) {
            html += `<div class="comment">
                <div class="meta">Time: ${c.time}<br>Name: ${c.name}</div>
                <div><b>Comment:</b> ${c.comment}</div>
            </div>`;
        }
        document.getElementById('comments').innerHTML = html;
    }

    showComments();
    </script>
</body>
</html>
